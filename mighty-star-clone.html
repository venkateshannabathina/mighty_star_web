<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mighty Star — Your life companions</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Italianno&display=swap');

      * { box-sizing: border-box; }
      html, body { margin: 0; background: #000; color: #fff; font-family: Inter, Arial, sans-serif; }
      .page { min-height: 100svh; display: flex; flex-direction: column; overflow: hidden; position: relative; isolation: isolate; }
      .bg, .shade { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
      .bg { filter: brightness(.65) saturate(.75); }
      .shade { z-index: -1; background: linear-gradient(#000d, #0002 45%, #05102585); }
      header { padding: 45px 0; text-align: center; }
      .logo { color: #fff; font-size: 26px; font-weight: 800; letter-spacing: 2px; text-transform: lowercase; }
      main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: translateY(-2vh); }
      h1 { margin: 0; color: #fff; font-size: clamp(64px, 8.2vw, 103px); font-weight: 800; line-height: .9; text-align: center; white-space: nowrap; }
      h1 i { margin: 0 .13em; font: 1.2em Italianno, cursive; font-weight: 400; }
      .sub { margin: 17px 0 50px; font-size: 28px; font-weight: 700; }
      .coming-soon { display: inline-flex; align-items: center; gap: 10px; padding: 15px 24px; border: 1px solid #ffffff80; border-radius: 999px; background: #0008; color: #fff; font-size: 16px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
      .coming-icon { display: grid; width: 26px; height: 26px; place-items: center; border-radius: 50%; background: #fff; color: #000; font-size: 15px; }
      footer { padding: 0 24px 32px; }
      .socials, .legal { display: flex; justify-content: center; }
      .socials { gap: 56px; margin-bottom: 48px; }
      .socials a { color: #fff; font-weight: 600; text-decoration: none; }
      .socials img { width: 24px; margin-right: 12px; vertical-align: middle; }
      .legal { gap: 29px; }
      .legal a { color: #c3c2c6; font-size: 12px; }

      @media (max-width: 767px) {
        header { padding: 29px 0; }
        .logo { font-size: 19px; }
        main { justify-content: flex-end; padding-bottom: 58px; transform: none; }
        h1 { width: 330px; font-size: 56px; line-height: 1; text-align: left; white-space: normal; }
        h1 i { font-size: 64px; }
        .sub { margin: 10px 0 30px; font-size: 16px; }
        .coming-soon { padding: 13px 20px; font-size: 13px; }
        .coming-icon { width: 22px; height: 22px; font-size: 13px; }
        .socials { justify-content: space-between; gap: 0; margin-bottom: 32px; }
        .socials a { font-size: 0; }
        .socials img { width: 20px; margin: 0; }
        .legal { gap: 13px; }
        .legal a { font-size: 10px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <video class="bg" id="bg" autoplay muted playsinline preload="auto" poster="https://animates.ai/bg.webp">
        <source src="https://animates.ai/gb-vid.webm" type="video/webm">
      </video>
      <div class="shade"></div>
      <header><span class="logo">mighty star</span></header>
      <main>
        <h1>Your <i>life</i> companions.</h1>
        <p class="sub">Experience a new level of presence</p>
        <div class="coming-soon" aria-label="Coming soon">
          <span class="coming-icon" aria-hidden="true">✦</span>
          <span>Coming soon</span>
        </div>
      </main>
      <footer>
        <div class="socials">
          <a><img src="https://animates.ai/x.png" alt="">X.com</a>
          <a><img src="https://animates.ai/ig.png" alt="">Instagram</a>
          <a><img src="https://animates.ai/tt.png" alt="">TikTok</a>
          <a><img src="https://animates.ai/release/discord.svg" alt="">Discord</a>
        </div>
        <div class="legal"><a>by mighty star</a><a>Privacy Policy</a><a>Terms of Use</a></div>
      </footer>
    </div>
    <script>
      const video = document.querySelector('#bg');
      const replay = () => { video.currentTime = 0; video.play().catch(() => {}); };
      video.onended = replay;
      video.onerror = replay;
      replay();
    </script>
  </body>
</html>
